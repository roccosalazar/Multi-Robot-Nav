/**:
  ros__parameters:
    frontend:
      odom_topic: "scan_matching_odometry/odom"
      sensor_type: "lidar"
      pointcloud_topic: "prefiltering/filtered_points"

      voxel_size: 0.10
      registration_min_inliers: 32
      registration_min_fitness: 0.62
      registration_max_rmse: 0.30
      registration_timeout_sec: 30.0
      enable_intra_loop_odom_consistency_check: true
      intra_loop_odom_consistency_max_translation_m: 8.0
      intra_loop_odom_consistency_max_rotation_deg: 45.0
      similarity_threshold: 0.85

      inter_robot_loop_closure_budget: 1
      enable_inter_loop_consistency_check: true
      inter_loop_consistency_min_cluster_size: 3
      inter_loop_consistency_max_translation_m: 2.0
      inter_loop_consistency_max_rotation_deg: 5.0
      inter_loop_consistency_max_pending_edges: 100
      inter_robot_detection_period_sec: 5
      enable_sparsification: true
      max_queue_size: 10

      global_descriptors_topic: "global_descriptors"
      intra_loop_min_inbetween_keyframes: 10
      detection_publication_period_sec: 0.5
      detection_publication_max_elems_per_msg: 100
      enable_intra_robot_loop_closures: true

      keyframe_generation_ratio_distance: 1.0
      pointcloud_odom_approx_time_sync_s: 0.05
      use_vertex_cover_selection: true
      map_manager_process_period_ms: 20
      global_descriptor_technique: "scancontext"

    neighbor_management:
      enable_neighbor_monitoring: true
      max_heartbeat_delay_sec: 5.0
      init_delay_sec: 5.0
      heartbeat_period_sec: 1.0
    backend:
      pose_graph_optimization_start_period_ms: 10000
      pose_graph_optimization_loop_period_ms: 100
      max_waiting_time_sec: 5
      enable_broadcast_tf_frames: true
      inter_robot_loop_rotation_noise_std: 0.10
      inter_robot_loop_translation_noise_std: 1.00
      inter_robot_loop_huber_k: 1.0
    evaluation:
      enable_logs: false
      log_folder: "results"
      enable_gps_recording: false
      gps_topic: "gps/fix"
      enable_sparsification_comparison: false
    visualization:
      enable: true
      publishing_period_ms: 100
